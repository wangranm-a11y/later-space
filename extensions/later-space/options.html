<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css"><title>Later Space 设置</title></head><body class="options"><main><h1>Later Space Collector</h1><p>填写可接收收藏的服务地址。本机版使用默认地址；接入云端后替换成公网地址，浏览器关闭或电脑休眠时也能先在插件里排队。</p><label>服务地址<input id="endpoint" type="url" placeholder="http://127.0.0.1:5177"></label><label>收集令牌 <span>跨设备或公网使用时填写</span><input id="token" type="password" autocomplete="off"></label><div class="option-actions"><button id="save" type="button">保存设置</button><button id="test" class="secondary" type="button">测试连接</button></div><p id="status"></p><small>快捷收藏：点击插件图标，或按 Control + Shift + L。网页、链接、图片和选中文字也可以通过右键保存。</small></main><script src="options.js"></script></body></html>
