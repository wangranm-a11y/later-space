<!doctype html>
<html lang="zh-CN">
  <head><meta charset="utf-8" /><link rel="stylesheet" href="styles.css" /><title>Later Space</title></head>
  <body class="popup">
    <header class="popup-header"><span class="brand"><img class="brand-icon" src="icon.svg" alt="" /><strong>Later Space</strong></span><span class="health-dot" id="healthDot" aria-label="正在检查连接"></span></header>
    <main>
      <section class="page-preview" aria-label="当前网页"><span>当前网页</span><strong id="pageTitle">读取中…</strong></section>
      <button id="save" class="save" type="button"><span>加入 Later Space</span><b aria-hidden="true">＋</b></button>
      <p id="status" class="capture-status" aria-live="polite">点一下，先接住。</p>
      <section id="diagnosis" class="diagnosis" aria-live="polite" hidden><div><span id="diagnosisEyebrow">CONNECTION</span><strong id="diagnosisTitle">正在检查连接</strong><p id="diagnosisDetail">你的收藏会先保留在插件中。</p></div><button id="repair" type="button">修复并重试</button></section>
      <section id="recent" class="recent" hidden><span class="recent-label">最近接住</span><button id="recentView" class="recent-card" type="button"><span id="recentKind" class="recent-kind">链接</span><span id="recentTitle" class="recent-title">收藏的内容</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 16L16 8M10 8h6v6" /></svg></button></section>
      <div class="capture-actions"><button id="view" type="button" hidden>查看刚刚加入</button><button id="undo" type="button" hidden>撤销</button></div>
      <button id="retry" type="button" hidden></button><button id="connect" type="button" hidden>连接 Later Space</button>
    </main>
    <footer><span id="destination">正在确认保存位置…</span><a href="https://wangranm-a11y.github.io/later-space/" target="_blank">打开画布 ↗</a></footer>
    <nav class="popup-meta"><button id="guide" type="button">使用指南</button><button id="settings" type="button">设置</button></nav>
    <script src="feedback-sound.js"></script><script src="popup.js"></script>
  </body>
</html>
