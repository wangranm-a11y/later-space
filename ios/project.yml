name: LaterSpace
options:
  bundleIdPrefix: com.stella
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
targets:
  LaterSpace:
    type: application
    platform: iOS
    sources:
      - path: LaterSpace
      - path: Shared
    info:
      path: LaterSpace/Info.plist
    entitlements:
      path: LaterSpace/LaterSpace.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stella.laterspace
        PRODUCT_NAME: Later Space
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: LaterSpaceShare
        embed: true
  LaterSpaceShare:
    type: app-extension
    platform: iOS
    sources:
      - path: LaterSpaceShare
      - path: Shared
    info:
      path: LaterSpaceShare/Info.plist
    entitlements:
      path: LaterSpaceShare/LaterSpaceShare.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stella.laterspace.share
        PRODUCT_NAME: Later Space Share
        CODE_SIGN_STYLE: Automatic
